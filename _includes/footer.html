<footer class="site-footer">
  <div class="wrap foot">
    <p class="foot-tag">{{ site.tagline }}</p>
    <nav class="foot-links" aria-label="Footer">
      <a href="{{ site.links.github }}">{% include icon.html name="github" %}GitHub</a>
      <a href="{{ site.links.kofi }}">{% include icon.html name="cup" %}Ko-fi</a>
      <a href="{{ '/feed.xml' | relative_url }}">{% include icon.html name="rss" %}RSS</a>
    </nav>
    <p class="foot-small">&copy; {{ site.time | date: "%Y" }} {{ site.author }}</p>
  </div>
</footer>
